<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Font AR</title>
    <meta name="description" content="Webブラウザ上で、タップした場所に文字をAR空間で固定表示するプロトタイプ">

    <!-- Versions pinned exactly (not "@1") so jsdelivr never needs to re-resolve against the
         npm registry at runtime -- it can serve these cached files even if the package is ever
         unpublished or the @8thwall npm account disappears. -->
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1.0.0/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1.0.0/dist/xrextras.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1.0.0/dist/landing-page.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="src/index.css">
  </head>
  <body class="mode-menu">
    <!-- The main canvas used for drawing by the app. -->
    <canvas id="camerafeed"></canvas>

    <div id="contact-status" class="out">OUT</div>
    <div id="timer-status">スタートに触れて計測開始</div>

    <div id="ui">
      <div id="rod-length-row">
        <span>棒の長さ</span>
        <input id="rod-length" type="range" min="1" max="12" step="0.5" value="4.5" aria-label="青い棒の長さ">
        <output id="rod-length-value">4.5m</output>
      </div>

      <p id="instructions">文字を入力して地面をタップすると設置、設置済みの文字をタップすると選択されます</p>

      <div id="placement-panel">
        <div id="controls">
          <input id="text-input" type="text" maxlength="10" value="AR" placeholder="表示する文字">
          <select id="font-select" aria-label="フォント"></select>
        </div>
      </div>

      <div id="create-panel">
        <input id="course-name" type="text" maxlength="20" placeholder="コース名（省略すると文字が名前になります）">
        <div id="create-actions">
          <button id="create-save" type="button" class="panel-button">コースを保存</button>
          <button id="create-clear" type="button" class="panel-button">全部消す</button>
          <button id="create-cancel" type="button" class="panel-button panel-button-danger">キャンセル</button>
        </div>
      </div>

      <div id="course-actions">
        <button id="course-replace" type="button" class="panel-button">置き直す</button>
      </div>

      <div id="selection-panel" hidden>
        <div id="selection-size-row">
          <span>サイズ</span>
          <input id="selection-size" type="range" min="0.25" max="2.5" step="0.05" value="1" aria-label="選択中の文字のサイズ">
        </div>
        <div id="selection-actions">
          <button id="selection-delete" type="button" class="panel-button panel-button-danger">この文字を削除</button>
          <button id="selection-done" type="button" class="panel-button">完了</button>
        </div>
      </div>
    </div>

    <div id="gameover-overlay" class="run-overlay" hidden>
      <div id="gameover-message" class="run-overlay-message gameover">GAME OVER</div>
      <div id="gameover-time" class="run-overlay-time"></div>
      <button id="gameover-continue" class="run-overlay-button" type="button">CONTINUE</button>
    </div>

    <div id="clear-overlay" class="run-overlay" hidden>
      <div id="clear-message" class="run-overlay-message cleared">CLEAR</div>
      <div id="clear-time" class="run-overlay-time"></div>
      <div id="clear-best" class="run-overlay-best"></div>
      <button id="clear-save" class="run-overlay-button secondary" type="button" hidden>動画を保存</button>
      <button id="clear-retry" class="run-overlay-button" type="button">RETRY</button>
    </div>

    <button id="mode-back" class="back-button" type="button"></button>

    <div id="menu-screen" class="screen">
      <h1 class="menu-title">Font AR</h1>
      <p class="menu-lead">文字の上を、はみ出さないように棒で進もう</p>
      <button id="menu-single" class="menu-button" type="button">
        シングルモード<span>好きな文字を置いて自由に遊ぶ</span>
      </button>
      <button id="menu-community" class="menu-button" type="button">
        コミュニティモード<span>コースを作って共有・挑戦する</span>
      </button>
    </div>

    <div id="hub-screen" class="screen" hidden>
      <div class="screen-header">
        <button id="hub-back" class="back-button inline" type="button">← 戻る</button>
        <h2>コミュニティ</h2>
      </div>
      <div class="tabs" role="tablist">
        <button id="tab-created" class="tab active" type="button" role="tab" aria-selected="true">作ったコース</button>
        <button id="tab-played" class="tab" type="button" role="tab" aria-selected="false">プレイしたコース</button>
      </div>
      <div class="screen-body">
        <button id="hub-new" class="primary-button" type="button">＋ 新規作成</button>
        <ul id="course-list" class="course-list"></ul>
        <p id="course-empty" class="course-empty" hidden></p>
      </div>
    </div>

    <div id="toast" hidden></div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
